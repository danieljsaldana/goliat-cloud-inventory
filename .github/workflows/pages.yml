name: Goliat - GitHub Pages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  current:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      latest: ${{ steps.revision.outputs.latest }}
    steps:
      - name: Check that this is the latest main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'latest=false' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded revision $GITHUB_SHA; main is $latest."
          fi
  deploy:
    needs: current
    if: needs.current.outputs.latest == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      deployment: true
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preparar diagramas y datos ficticios
        run: node scripts/prepare-site.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v6
      - name: Publicar la carpeta site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
