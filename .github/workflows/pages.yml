name: Goliat - GitHub Pages

on:
  push:
    branches: [main]
    paths:
      [
        'site/**',
        'docs/architecture.html',
        'docs/azure-deployment.html',
        'scripts/prepare-site.mjs',
        'public/social/cloud-inventory.png',
        'server/modules/azure/seed/data/inventory.json',
        'src/core/**',
        'src/features/administration/**',
        '.github/workflows/pages.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preparar diagramas y datos ficticios
        run: node scripts/prepare-site.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Publicar la carpeta site/
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
