name: Refresh public GitHub stars
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-stars
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Verify the metadata publisher
        run: python3 -m unittest discover -s tests -p test_github_stars.py -v
      - name: Refresh the data-only github-stats branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_github_stars.py
